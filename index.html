<body data-theme="os">

  <!-- Startsida: restaurangval -->
  <div id="landing" class="landing" hidden>
    <div class="landing-inner">
      <img class="landing-logo" src="assets/logos/os.webp" alt="O's Streetfood logotyp" width="140" height="124">
      <h1 class="landing-title">Välj din <span class="accent">restaurang</span></h1>
      <p class="landing-sub">Tre kök. Samma kärlek till street food.</p>
      <div class="landing-cards">
        <button class="landing-card" data-choice="utby" style="--i:0">
          <img src="assets/img/hero-utby-800.jpg" alt="Friterad kycklingburgare hos O's Utby">
          <span class="card-veil"></span>
          <span class="card-text">
            <img class="card-logo" src="assets/logos/os.webp" alt="" aria-hidden="true">
            <span class="card-name">Utby</span>
            <span class="card-desc">Smash burgers &amp; street food</span>
          </span>
        </button>
        <button class="landing-card" data-choice="landala" style="--i:1">
          <img src="assets/img/hero-landala-800.jpg" alt="Smashburgare hos O's Landala">
          <span class="card-veil"></span>
          <span class="card-text">
            <img class="card-logo" src="assets/logos/os.webp" alt="" aria-hidden="true">
            <span class="card-name">Landala</span>
            <span class="card-desc">Smash burgers &amp; street food</span>
          </span>
        </button>
        <button class="landing-card landing-card--tacos" data-choice="tacos" style="--i:2">
          <img src="assets/img/hero-tacos-800.jpg" alt="Birria tacos hos TacO's">
          <span class="card-veil"></span>
          <span class="card-text">
            <img class="card-logo card-logo--round" src="assets/logos/tacos.webp" alt="" aria-hidden="true">
            <span class="card-name">Lindholmen</span>
            <span class="card-desc">Birria tacos &amp; burritos</span>
          </span>
        </button>
      </div>
    </div>
  </div>
